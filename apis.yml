aid: enclave
name: Enclave
description: >-
  Enclave (enclave.ai) is an AI-powered application and cloud security platform that operates as an
  "agentic security engineer." It continuously builds a living model of an organization's attack surface
  across services and cloud providers, then autonomously triages and investigates vulnerability findings
  against known CVEs to determine real-world exploitability and reachability. Rather than flooding teams
  with signature-based noise, Enclave traces data flows to confirm whether a CVE is actually reachable,
  surfaces cross-service exploits that traditional scanners miss, and routes prioritized remediation plans
  with proof to the owning teams. Founded by veterans from Stripe, Box, VMware, Salesforce, and Yelp, the
  company is backed by 8VC and Marc Benioff. Added to the API Evangelist network and enriched from the
  company's public web surface; no public developer API is currently published.
